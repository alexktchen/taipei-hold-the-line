# 台北車流模擬的資料：在 GitHub 的機器上抓 OpenStreetMap（Overpass）與臺北市號誌位置、時制計畫，整理成 traffic/data/，有變動就 commit 回 main（Cloudflare Pages 接著部署）。
# 在 GitHub 的 Actions 分頁按「Run workflow」就能重建（例如臺北市更新了時制）；資料流程本身（這個檔、scripts/traffic/）改了推上 main 也會自動跑。
name: 台北車流資料
on:
  workflow_dispatch:
  # 每天歐洲半夜（Overpass 最不塞的時候）自動重抓一次：上一次沒抓到的道路、建物、捷運接著補，臺北市時制也跟著更新
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - scripts/traffic/**
      - .github/workflows/traffic-data.yml
permissions:
  contents: write
concurrency:
  group: traffic-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Overpass 常大塞車：上一次抓到的結果留著（腳本只用 6 天內的），這次失敗的那幾個下次接著抓
      - name: 還原 Overpass 快取
        uses: actions/cache/restore@v4
        with:
          path: /tmp/overpass-cache
          key: overpass-${{ github.run_id }}
          restore-keys: overpass-
      - name: 抓資料並整理
        env:
          TRAFFIC_CACHE: /tmp/overpass-cache
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/traffic/build-data.mjs
      - name: 存 Overpass 快取（失敗也存，下次接著抓）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/overpass-cache
          key: overpass-${{ github.run_id }}
      - name: 檔案大小
        run: ls -la traffic/data traffic/data/raw && du -sh traffic/data/bld || true
      - name: 有變動就 commit 回 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/data
          if git diff --cached --quiet; then echo "資料沒有變動"; exit 0; fi
          git commit -m "更新台北車流資料（OpenStreetMap 道路、臺北市號誌位置與時制計畫）"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
