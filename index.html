<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>萬安政策島 已下架</title>
<meta name="description" content="萬安政策島（二創惡搞、非官方）已經關閉下架。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#db6a41">
<style>
  :root { --bg:#fff8f4; --ink:#211d1d; --muted:#78685e; --coral:#db6a41; --line:#211d1d1f; color-scheme:light; }
  * { box-sizing:border-box }
  html, body { height:100%; margin:0 }
  body { display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; line-height:1.6 }
  .box { max-width:460px; width:100%; background:#fff; border:1px solid var(--line); border-radius:28px; padding:36px 28px; box-shadow:0 12px 40px #78685e26; text-align:center }
  .future { font-size:11px; letter-spacing:.28em; color:var(--coral); font-weight:900 }
  .future span { color:var(--muted) }
  h1 { margin:10px 0 6px; font-size:28px; font-weight:900; letter-spacing:.02em }
  .status { display:inline-block; margin:6px 0 18px; padding:4px 14px; border-radius:999px; background:var(--coral); color:#fff8f4; font-weight:900; font-size:14px }
  p { margin:0 0 10px; color:var(--muted); font-size:15px }
  p:last-child { margin:0 }
</style>
</head>
<body>
  <main class="box" role="status">
    <div class="future">TAIPEI <span>HOLD THE LINE.</span></div>
    <h1>萬安政策島</h1>
    <div class="status">已關閉下架</div>
    <p>這個網友自製、非官方的二創惡搞遊戲已經結束營運，打工場、逛城市與台北車流模擬都不再提供。</p>
    <p>感謝每一位來打過工、逛過城市的玩家。</p>
  </main>
</body>
</html>
