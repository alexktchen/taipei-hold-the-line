<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>小島田園日記</title>
<style>
  /* ═══ 介面：粉彩紙卡風格；手機才顯示搖桿與澆水鈕 ═══ */
  :root { --ink:#4a3b52; --muted:#8a7a92; --paper:#fffaf3ee; --accent:#f09a8a; --line:#4a3b5222; color-scheme:light; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  /* 整頁不能被縮放：iOS 不理 user-scalable=no，連點按鈕兩下或在面板上捏合會把頁面放大、按鈕被推出畫面；touch-action:none 把雙擊縮放和捏合都關掉（學習畫面另外開放上下捲動）*/
  html, body { touch-action:none; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100% }
  html, body { margin:0; height:100%; overflow:hidden; background:#cfeefc; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--ink) }
  #app { position:fixed; inset:0; touch-action:none }
  .panel { position:fixed; left:max(16px, env(safe-area-inset-left)); top:max(16px, env(safe-area-inset-top)); width:min(270px, calc(100vw - 32px)); background:var(--paper); border-radius:18px; padding:12px 14px; box-shadow:0 6px 22px #6a4f7a33; display:flex; flex-direction:column; gap:8px; font-size:13px; user-select:none }
  .panel h1 { margin:0; font-size:17px; font-weight:900; color:var(--accent); letter-spacing:.04em; flex:1; white-space:nowrap }
  .panel .head { display:flex; align-items:center; gap:8px }
  #btnMin { flex:none; width:28px; height:28px; border-radius:50%; border:0; background:#fff; color:var(--ink); font:900 16px/1 system-ui, sans-serif; box-shadow:0 2px 6px #6a4f7a22; cursor:pointer }
  .panel .mini { display:none; font-weight:900; font-variant-numeric:tabular-nums }
  .panel.min { width:auto; padding:8px 10px 8px 14px } .panel.min > :not(.head) { display:none } .panel.min .mini { display:inline } .panel.min h1 { font-size:14px } /* 縮到最小：只剩標題、時間和展開鈕 */
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px }
  .clock { font-size:22px; font-weight:900; font-variant-numeric:tabular-nums }
  .chip { background:#fff; border-radius:999px; padding:3px 10px; font-weight:700; box-shadow:0 2px 6px #6a4f7a22 }
  label { display:flex; flex-direction:column; gap:3px; font-weight:700; color:var(--muted) }
  input[type=range] { width:100%; accent-color:var(--accent) }
  .keys { color:var(--muted); font-size:12px; line-height:1.5 }
  #hint { position:fixed; left:50%; bottom:max(28px, env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--paper); border-radius:999px; padding:8px 18px; font-weight:900; box-shadow:0 6px 18px #6a4f7a33; opacity:0; transition:opacity .2s; pointer-events:none; max-width:min(620px, calc(100vw - 32px)); text-align:center; line-height:1.45 }
  #hint.on { opacity:1 }
  #fade { position:fixed; inset:0; background:#fffaf3; opacity:0; pointer-events:none; transition:opacity .3s; z-index:40 } #fade.on { opacity:1 } /* 換地圖的淡入淡出 */
  #banner { position:fixed; left:50%; top:22%; transform:translate(-50%, 8px); background:var(--paper); border-radius:20px; padding:12px 26px; font-size:24px; font-weight:900; color:var(--accent); box-shadow:0 8px 24px #6a4f7a33; opacity:0; transition:opacity .4s, transform .4s; pointer-events:none; z-index:41; max-width:calc(100vw - 32px); text-align:center } #banner.on { opacity:1; transform:translate(-50%, 0) }
  #joy { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:#ffffff55; border:3px solid #ffffffaa; display:none; pointer-events:none }
  #joy i { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:#fffaf3; box-shadow:0 4px 12px #6a4f7a44 }
  #btnAct { position:fixed; right:max(22px, env(safe-area-inset-right)); bottom:max(26px, env(safe-area-inset-bottom)); width:76px; height:76px; border-radius:50%; border:0; background:#8fd3f0; color:#fff; font-size:32px; box-shadow:0 6px 0 #5aa9cc, 0 10px 22px #6a4f7a44; display:none }
  #btnAct:active { transform:translateY(4px); box-shadow:0 2px 0 #5aa9cc }
  #btnWave { position:fixed; right:max(110px, calc(env(safe-area-inset-right) + 110px)); bottom:max(30px, env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; border:0; background:#fffaf3; font-size:26px; box-shadow:0 5px 0 #e6d6c8, 0 8px 18px #6a4f7a33; display:none }
  #btnCam { position:fixed; right:max(16px, env(safe-area-inset-right)); top:max(16px, env(safe-area-inset-top)); width:46px; height:46px; border-radius:50%; border:0; background:var(--paper); font-size:22px; box-shadow:0 4px 12px #6a4f7a33; display:none }
  .tkeys { display:none; color:var(--muted); font-size:12px; line-height:1.5 }
  body.touch #btnAct, body.touch #btnWave, body.touch #btnCam { display:block } body.touch .tkeys { display:block }
  body.touch #hint { bottom:max(116px, calc(env(safe-area-inset-bottom) + 116px)) } /* 手機：對話泡泡放在按鈕上面 */ body.touch .keys { display:none }
  @media (max-width:640px) { .panel { padding:10px 12px; width:min(250px, calc(100vw - 92px)) } .panel h1 { font-size:15px } }
</style>
</head>
<body>
<div id="app" aria-label="小島田園日記 3D 場景"></div>
<section class="panel" aria-label="時間與設定">
  <div class="head"><h1>🌱 小島田園日記</h1><span class="mini" id="clockMini"></span><button type="button" id="btnMin" aria-expanded="true" aria-label="縮小面板" title="縮小／展開">－</button></div>
  <div class="row"><span class="clock" id="clock">09:00</span><span class="chip" id="harvest">🧺 收成 0</span></div>
  <div class="row"><span class="chip" id="mapName">📍 新手村</span><span class="chip" id="learnCount">🌸 精通 0</span></div>
  <label>時間流速 <input type="range" id="speed" min="0" max="120" step="1" value="6" aria-label="時間流速（每秒經過幾分鐘）"></label>
  <label>現在時刻 <input type="range" id="tod" min="0" max="24" step="0.05" value="9" aria-label="一天中的時刻"></label>
  <div class="keys">WASD 或點地面走路・空白鍵 澆水／收成／聊天・F 揮手・1～3 表情<br>Q／E 轉鏡頭・右鍵拖曳旋轉與俯仰・滾輪縮放・R 重置鏡頭</div>
  <div class="tkeys">點地面或左邊拖曳走路・雙指左右滑轉鏡頭、上下滑調俯角、捏合縮放</div>
</section>
<div id="hint"></div>
<div id="fade" aria-hidden="true"></div>
<div id="banner" aria-live="polite"></div>
<div id="joy"><i></i></div>
<button id="btnAct" type="button" aria-label="澆水、收成或聊天">💧</button>
<button id="btnWave" type="button" aria-label="揮手">👋</button>
<button id="btnCam" type="button" aria-label="重置鏡頭">🎥</button>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { createForest } from './forest/map.js';
import * as LEARN from './forest/learn.js';
import * as GAMES from './forest/games.js';

/* ════════════════════════════════════════════════════════════════
   0. 設定：配色、地平線彎曲、裝置等級（改這裡就能換風格）
   ════════════════════════════════════════════════════════════════ */
const MOBILE = matchMedia('(pointer:coarse)').matches || /Mobi|Android/i.test(navigator.userAgent);
const CFG = {
  curve: 0.012,        // 地平線彎曲：往前後每遠 d 單位，地面下降 curve × d²（0 = 平的）
  curveSide: 0.0015,   // 左右方向的彎曲（0 = 純圓柱；調大就像小行星）
  outline: 0.035,      // 描邊粗細（世界單位）
  cam: { dist: 17, pitch: 45, minDist: 9, maxDist: 24, minPitch: 30, maxPitch: 60, smooth: 8 }, // 相機：預設距離、俯角（度）、縮放與俯仰的範圍、平滑程度
  grass: MOBILE ? 5000 : 12000,
  trees: MOBILE ? [70, 50] : [150, 110], // [闊葉樹, 針葉樹]
  petals: MOBILE ? 60 : 140,
  shadowMap: MOBILE ? 1024 : 2048,
  pal: {
    grass: [0x9bd66b, 0x86c95e, 0xaee07c], grassFar: 0x76b85a, dirt: 0xe2b98a, sand: 0xf4e3b8, field: 0xc9935f,
    soil: 0x8b5e40, soilWet: 0x5b3a28, outline: 0x4a3352,
    water: 0x7fd4dc, waterDeep: 0x4fb3c8, foam: 0xffffff,
    leaf: [0x8fd36f, 0x7cc76a, 0xa8de7e, 0x9ccf6a], pine: [0x5fae84, 0x6fbf8f, 0x4f9e7a], trunk: 0xb98258,
    wall: 0xfff1dc, roof: 0xf2928a, wood: 0xc99a6a, woodDark: 0x9a6b48, window: 0xffd27a,
    skin: 0xffe1c9, overall: 0x8fb6ec, hair: 0xd98a5a, blush: 0xffa7b6,
    flowers: [0xffb3c7, 0xfff3a8, 0xffffff, 0xd8c2ff, 0xffc9a0], rock: [0xc9c2d6, 0xb8b0c8, 0xd6cfdf], mushroom: [0xf28b8b, 0xf7b2c4, 0xf6c06a],
  },
};
const WATER_Y = -0.35, RIVER_W = 2.0, PLAYER_R = 0.32;

/* ════════════════════════════════════════════════════════════════
   1. scene：渲染器、相機、燈光、天空
   ════════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); // devicePixelRatio 上限 2
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和陰影
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdff4ff, 24, 58); // 距離霧：顏色每幀跟著天空的地平線色
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
// 燈光：太陽（投影）＋半球光（天空色／偏紫的地面色）＋環境光（暖紫）→ 背光面與陰影會偏暖紫而不是黑色
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.castShadow = true;
sun.shadow.mapSize.set(CFG.shadowMap, CFG.shadowMap); Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 }); // 陰影只算角色附近（限制範圍＝省效能）
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4;
const hemi = new THREE.HemisphereLight(0xd7ecff, 0xb89ed6, 0.95), amb = new THREE.AmbientLight(0xcab6e8, 0.4);
scene.add(sun, sun.target, hemi, amb);
// 天空：一顆大球，頂部到地平線的漸層（不吃霧、跟著相機走）
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uTop, uHorizon; varying vec3 vDir;
    void main(){ float h = clamp(vDir.y, -0.1, 1.0); gl_FragColor = vec4(mix(uHorizon, uTop, smoothstep(0.0, 0.55, h)), 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }` });
const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 24, 12), skyMat); sky.renderOrder = -1; scene.add(sky);

/* ── 卡通著色共用：4 階 gradientMap、地平線彎曲、描邊、彎過的陰影深度材質 ── */
function makeGradient(steps) { const t = new THREE.DataTexture(new Uint8Array(steps), steps.length, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; }
const GRADIENT = makeGradient([95, 165, 220, 255]); // 4 階：暗、半暗、亮、高光
// 地平線彎曲：所有材質共用同一組 uniform；在世界座標往下彎，再換回物件座標（投影、陰影、霧都用彎過的位置）
const CURVE = { uCurve: { value: CFG.curve }, uCurveSide: { value: CFG.curveSide }, uCurvePivot: { value: new THREE.Vector3() }, uCurveFwd: { value: new THREE.Vector2(0, -1) } }; // uCurveFwd＝相機水平朝向（旋轉相機時地平線跟著轉）
const CURVE_GLSL = /* glsl */`
  uniform float uCurve; uniform float uCurveSide; uniform vec3 uCurvePivot; uniform vec2 uCurveFwd;
  vec3 curveWorld(vec3 w) { vec2 r = w.xz - uCurvePivot.xz; float f = dot(r, uCurveFwd), sd = dot(r, vec2(-uCurveFwd.y, uCurveFwd.x)); w.y -= uCurve * f * f + uCurveSide * sd * sd; return w; }`;
// CPU 端算同一個彎曲量（遮擋判斷要用彎過的位置）
const curveDrop = (x, z) => { const P = CURVE.uCurvePivot.value, F = CURVE.uCurveFwd.value, rx = x - P.x, rz = z - P.z, f = rx * F.x + rz * F.y, sd = -rx * F.y + rz * F.x; return CURVE.uCurve.value * f * f + CURVE.uCurveSide.value * sd * sd; };
// fade＝每個實例各自的透明度（InstancedMesh 的 aFade 屬性，遮擋相機時淡出用；材質要 transparent）
function curvify(mat, outline = 0, fade = false) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, CURVE);
    if (fade) { sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float aFade; varying float vFade;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvFade = aFade;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vFade;').replace('#include <opaque_fragment>', 'diffuseColor.a *= vFade;\n#include <opaque_fragment>'); }
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\n' + CURVE_GLSL).replace('#include <begin_vertex>', `#include <begin_vertex>
      ${outline ? `transformed += normalize(normal) * ${outline.toFixed(4)};` /* 描邊：沿法線往外撐一層 */ : ''}
      { mat4 cm = modelMatrix;
        #ifdef USE_INSTANCING
          cm = cm * instanceMatrix;
        #endif
        if (abs(determinant(cm)) > 1e-12) { vec4 cw = cm * vec4(transformed, 1.0); cw.xyz = curveWorld(cw.xyz); transformed = (inverse(cm) * cw).xyz; } } // 縮放成 0 的（藏起來的）實例不能求反矩陣，跳過`);
  };
  mat.customProgramCacheKey = () => 'curve' + outline + (fade ? 'fade' : '');
  return mat;
}
const OUTLINE = curvify(new THREE.MeshBasicMaterial({ color: CFG.pal.outline, side: THREE.BackSide }), CFG.outline); // 反向法線外殼描邊
const DEPTH = curvify(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking })); // 陰影也跟著彎
const toonCache = new Map();
function toon(color, opts = {}) { const key = color + JSON.stringify(opts); if (!toonCache.has(key)) toonCache.set(key, curvify(new THREE.MeshToonMaterial({ color, gradientMap: GRADIENT, ...opts }))); return toonCache.get(key); }
// 加一個 mesh：預設有描邊、投影、接影；彎曲會讓物體離開原本的包圍盒，所以關掉視錐剔除
function addMesh(geo, mat, parent, { outline = true, cast = true, receive = true } = {}) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = receive; m.frustumCulled = false; if (cast) m.customDepthMaterial = DEPTH; parent.add(m);
  if (outline) { const o = new THREE.Mesh(geo, OUTLINE); o.frustumCulled = false; m.add(o); } return m;
}
// 加一組 InstancedMesh：描邊用同一份 instanceMatrix（一次更新兩個都動）
function addInstanced(geo, mat, count, { outline = true, cast = true, receive = true, outlineMat = OUTLINE } = {}) {
  const im = new THREE.InstancedMesh(geo, mat, count); im.castShadow = cast; im.receiveShadow = receive; im.frustumCulled = false; if (cast) im.customDepthMaterial = DEPTH; ROOT.add(im);
  let o = null; if (outline) { o = new THREE.InstancedMesh(geo, outlineMat, count); o.instanceMatrix = im.instanceMatrix; o.frustumCulled = false; ROOT.add(o); }
  return { im, o, setCount(n) { im.count = n; if (o) o.count = n; } };
}
const merge = list => mergeGeometries(list.map(g => (g.index ? g.toNonIndexed() : g)));
// 圓角方塊（同尺寸共用一份）：場景物件和角色都用它，積木風一致；圓角讓法線連續，描邊在角落不會裂開。要合併或位移時用 Gc() 拿一份複本
const GEO = new Map();
function G(w, h, d, r = 0.022) { const k = [w, h, d, r].join(); if (!GEO.has(k)) GEO.set(k, new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2 - 0.002, h / 2 - 0.002, d / 2 - 0.002))); return GEO.get(k); }
const Gc = (w, h, d, r, x = 0, y = 0, z = 0, ry = 0) => G(w, h, d, r).clone().rotateY(ry).translate(x, y, z);
// 會被淡出的材質（樹、房子）：一直開著 transparent，透明度 1 時看起來和一般材質一樣
const fadeToon = color => curvify(new THREE.MeshToonMaterial({ color, gradientMap: GRADIENT, transparent: true }), 0, true);
const OUTLINE_FADE = curvify(new THREE.MeshBasicMaterial({ color: CFG.pal.outline, side: THREE.BackSide, transparent: true }), CFG.outline, true);
const cloneMat = m => { const c = m.clone(); c.onBeforeCompile = m.onBeforeCompile; c.customProgramCacheKey = m.customProgramCacheKey; return c; };
const rand = (() => { let s = 20241031; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); })(); // 固定種子：每次打開都是同一座島
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
// 每張地圖一個 Group（田園＝新手村 village，學習森林的地圖由 forest/map.js 建）；建東西時加到 ROOT，換地圖時只切換顯示
const village = new THREE.Group(); scene.add(village); let ROOT = village; const setRoot = g => { ROOT = g || village; };
let colliders = []; // 圓形碰撞：{ x, z, r }（換地圖時換成那張地圖的）

/* ════════════════════════════════════════════════════════════════
   2. terrain：草地小坡、蜿蜒小河、小路、木橋、水面、搖曳草叢
   ════════════════════════════════════════════════════════════════ */
const HOUSE = { x: -9, z: -7 }, FARM = { x: 1.5, z: 4.2, cols: 6, rows: 4, cell: 1.25 }, BRIDGE_Z = 2.0;
const riverX = z => 13 + 3.2 * Math.sin(z * 0.085) + 1.6 * Math.sin(z * 0.21 + 1.0); // 小河中心線（GLSL 裡有同一個式子）
const BRIDGE_X = riverX(BRIDGE_Z), BRIDGE_L = 2 * (RIVER_W + 1.8);
const PATH = [[HOUSE.x, HOUSE.z + 2.0], [-6.5, -2.6], [-2.5, -0.6], [FARM.x, 0.4], [6, 1.2], [BRIDGE_X - BRIDGE_L / 2, BRIDGE_Z], [BRIDGE_X + BRIDGE_L / 2, BRIDGE_Z], [22, 3.5], [30, 7]];
function distSeg(px, pz, ax, az, bx, bz) { const vx = bx - ax, vz = bz - az, t = Math.max(0, Math.min(1, ((px - ax) * vx + (pz - az) * vz) / (vx * vx + vz * vz))); return Math.hypot(px - ax - vx * t, pz - az - vz * t); }
const FOREST_GATE = { x: 1, z: -13.4 }, PATH2 = [[-2.5, -0.6], [-1.6, -6], [FOREST_GATE.x, FOREST_GATE.z + 0.6]]; // 往北通到學習森林入口的小路
const pathDist = (x, z) => { let d = 1e9; for (const P of [PATH, PATH2]) for (let i = 0; i < P.length - 1; i++) d = Math.min(d, distSeg(x, z, ...P[i], ...P[i + 1])); return d; };
const rectDist = (x, z, cx, cz, hw, hd) => Math.hypot(Math.max(Math.abs(x - cx) - hw, 0), Math.max(Math.abs(z - cz) - hd, 0));
const FARM_HW = FARM.cols * FARM.cell / 2 + 0.9, FARM_HD = FARM.rows * FARM.cell / 2 + 0.9;
function noise(x, z) { return Math.sin(x * 0.73 + Math.sin(z * 0.31) * 2.1) * Math.cos(z * 0.67 + Math.sin(x * 0.27) * 1.7); }
function terrainHeight(x, z) {

  petals.forEach((p, i) => { p.y -= p.sp * dt; p.ph += dt; p.rx += dt * 2.1; p.rz += dt * 1.3; if (p.y < 0) { p.y = 6 + rand() * 2; p.x = (rand() - 0.5) * 26; p.z = (rand() - 0.5) * 26; }
    M4.compose(V.set(camTarget.x + p.x + Math.sin(p.ph) * 0.6, p.y + groundAt(camTarget.x + p.x, camTarget.z + p.z), camTarget.z + p.z + Math.cos(p.ph * 0.7) * 0.4), Q.setFromEuler(E.set(p.rx, p.ph, p.rz)), S.setScalar(1)); petalI.setMatrixAt(i, M4); }); petalI.instanceMatrix.needsUpdate = true;
  smoke.forEach(m => { m.userData.t = (m.userData.t + dt * 0.18) % 1; const t = m.userData.t; m.position.set(chimneyTop.x + Math.sin(t * 6 + time) * 0.25 * t, chimneyTop.y + t * 2.6, chimneyTop.z - t * 0.6); m.scale.setScalar(0.6 + t * 1.6); m.material.opacity = 0.65 * (1 - t); });
  renderer.render(scene, camera);
}
// 視窗縮放自適應
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 52 : 40; camera.updateProjectionMatrix(); ffMat.uniforms.uPR.value = renderer.getPixelRatio(); }
resize(); addEventListener('resize', resize);
renderer.setAnimationLoop(loop);
window.FARM_DEBUG = { CFG, CURVE, CAM, TREES, HOUSE_FADE, resetCamera, gotoMap, MAPS, LEARN, get MAP() { return MAP; }, PL, PLOTS, hero, neighbors, camTarget, setHour: h => { hour = h; }, water: () => { actPressed = true; } }; // 除錯用
</script>
