<!doctype html><meta charset="utf-8"><title>圖示總覽</title>
<style>body{font-family:sans-serif;background:#fffaf3;margin:16px}#g{display:grid;grid-template-columns:repeat(auto-fill,88px);gap:10px}#g div{text-align:center;font-size:11px;color:#6e5d7a}</style>
<div id="g"></div>
<script type="module">import { svg, NAMES } from '../icons.js'; document.getElementById('g').innerHTML = NAMES.map(n => `<div>${svg(n, 64)}<br>${n}</div>`).join('');</script>
